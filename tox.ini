[tox]
minversion=2.0
isolated_build=True
envlist=
    py3{10,11,12,13,14}-f8_{min,latest}
    py3{13,14}-f8_{5_x,6_x}
    sdist_install
    flake8

[testenv]
commands=
    flake8 --version
    pytest
deps=
    pytest

    f8_latest:     flake8
    f8_min:        flake8==5.0
    f8_5_x:        flake8~=5.0
    f8_6_x:        flake8~=6.0

[testenv:win32]
platform=win32
basepython=
    py313: python3.13
    py312: python3.12
    py311: python3.11
    py310: python3.10

[testenv:linux]
platform=linux
basepython=
    py314: python3.14
    py313: python3.13
    py312: python3.12
    py311: python3.11
    py310: python3.10

[testenv:sdist_install]
commands=
    python -c "import flake8_absolute_import"

[testenv:flake8]
skip_install=False
deps=
    -rrequirements-flake8.txt
commands=
    flake8 --version
    flake8 tests src

[testenv:black]
skip_install=True
deps=black
commands=
    black {posargs} .

[testenv:mypy]
description=Type-check with mypy
skip_install=True
deps=mypy
commands=
    mypy --version
    mypy {posargs} src tests

[testenv:isort]
description=Sort, group, and coalesce imports
skip_install=True
deps=isort
commands=
    isort --version
    isort {posargs} src tests

[testenv:check]
description=Run isort, black, flake8, and mypy
skip_install=True
deps=
    isort
    black
    -r requirements-flake8.txt
    mypy
commands=
    isort --version
    isort {posargs} src tests
    black {posargs} .
    flake8 --version
    flake8 tests src
    mypy --version
    mypy {posargs} src tests

[testenv:build]
description=Build project to wheel and sdist
skip_install=True
deps=build
commands=
    python -m build

[pytest]
addopts = -v -rsX -W error::Warning --strict-markers
xfail_strict = True


[flake8]
# W503: black formats binary operators to start of line
# RST30[56]: Ignore non-default substitutions/targets; use '$ make html O=-n' to find typos
ignore = W503,RST305,RST306
show_source = True
max_line_length = 88
format = ${cyan}%(path)s${reset}:${yellow}%(row)d${reset}:${green}%(col)d${reset} ${red}(%(code)s)${reset} %(text)s
per_file_ignores =
# S101: pytest uses asserts liberally
  tests/*:     S101
  conftest.py: S101
# F401: MANY things imported but unused in __init__,py
  src/flake8_absolute_import/__init__.py:  F401

# flake8-import-order
import-order-style = smarkets
application-import-names = flake8_absolute_import

# flake8-rst-docstrings (requires >=0.0.11)
# These declare directives/roles to be treated as 'known',
# in addition to those in 'core' reST.
rst-roles =
  attr,class,exc,func,meth,mod,obj
